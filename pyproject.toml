[project]
name = "agentic_ai"
version = "0.1.0"
description = "This is my first agentic AI project"
readme = "README.md"
authors = [
    { name = "artiborkar", email = "borkararti207@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
